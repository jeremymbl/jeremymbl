name: Snake

on:
  schedule:
    - cron: "0 4 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots matches the current GitHub contribution palette (snk presets are older)
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#8250df&color_dots=#eff2f5,#aceebb,#4ac26b,#2da44e,#116329
            dist/snake-dark.svg?palette=github-dark&color_snake=#a371f7&color_dots=#151b23,#033a16,#196c2e,#2ea043,#56d364

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
